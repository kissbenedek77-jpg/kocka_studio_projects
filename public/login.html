<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Belépés · Kocka Studio Projects</title>
<style>
  .login-shell{min-height:100dvh;display:grid;place-items:center;padding:24px;background:#f5f5f5}
  .login-card{width:min(100%,430px);padding:clamp(24px,5vw,44px);background:#fff;border:1px solid #e3e3e3;border-top:6px solid #77c59e;box-shadow:0 12px 36px #2b2b2b14}
  .login-mark{font-size:12px;font-weight:700;letter-spacing:.17em;text-transform:uppercase;color:#41885f}
  .login-card h1{margin:12px 0 8px;font-size:32px}
  .login-card p{margin:0 0 24px}.login-card label{display:block;margin:0 0 7px;font-weight:600;color:#343434}
  .login-card input{display:block;width:100%;padding:13px;margin-bottom:18px;box-sizing:border-box}
  .login-card .button,.login-card .link-button{width:100%;min-height:46px;padding:11px 16px;box-sizing:border-box}
  .login-card .secondary{margin-top:12px}.login-card .notice{padding:12px;margin-bottom:18px}
</style></head><body><main class="login-shell"><section class="login-card" aria-labelledby="loginTitle">
  <div class="login-mark">Kocka Stúdió</div><h1 id="loginTitle">Projektmenedzser</h1>
  <p>Tulajdonosi belépés</p>
  {{ERROR}}
  {{LOCAL_FORM}}
  <a class="link-button secondary" href="{{GOOGLE_URL}}">Belépés Google-fiókkal</a>
</section></main></body></html>
