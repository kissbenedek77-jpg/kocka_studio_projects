<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <title>Weboldal · Kocka Stúdió</title>
  <style>
    :root{font-family:Arial,sans-serif;color:#26312e;background:#eeeee9;--ink:#26312e;--muted:#627069;--line:#d7dad4;--gold:#a88952}
    *{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;min-height:100dvh}
    button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.48}
    .top{background:#3e3e3e;color:#fff;padding:16px max(20px,calc((100vw - 1600px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px}
    .top img{width:min(190px,44vw);max-height:56px;object-fit:contain;object-position:left center}
    .top nav{display:flex;gap:16px;font-size:13px}.top a{color:#e8e8e8;text-decoration:none}.top a:hover{text-decoration:underline}
    .shell{max-width:1600px;margin:auto;padding:24px 20px 80px}
    h1{font-size:clamp(24px,3vw,34px);font-weight:400;letter-spacing:-.03em;margin:0 0 6px}
    .lead{color:var(--muted);line-height:1.55;margin:0 0 18px;max-width:900px}
    #status{min-height:0}
    .notice{margin:0 0 14px;padding:11px 14px;border-left:4px solid var(--gold);background:#fffaf0;font-size:14px;line-height:1.45}
    .notice.error{border-color:#a6372f;background:#fff2f0;color:#7d241e}
    .notice.success{border-color:#4f8562;background:#eef8f0;color:#245335}
    .layout{display:grid;grid-template-columns:minmax(180px,230px) minmax(0,1fr);gap:18px;align-items:start}
    .nav{background:#fff;border:1px solid var(--line);padding:8px;position:sticky;top:0}
    .nav button{display:block;width:100%;text-align:left;padding:10px;border:0;border-left:3px solid transparent;background:transparent;color:var(--muted);font-size:14px}
    .nav button:hover{background:#f7f8f4}
    .nav button.active{border-left-color:var(--gold);background:#f5f2eb;color:var(--ink);font-weight:700}
    .nav .nav-sep{height:1px;background:var(--line);margin:8px 4px}
    .panel{background:#fff;border:1px solid var(--line);padding:clamp(18px,2.4vw,32px);min-width:0}
    .panel h2{font-size:20px;font-weight:400;margin:26px 0 10px;padding-top:16px;border-top:1px solid var(--line)}
    .panel h2:first-child{margin-top:0;padding-top:0;border-top:0}
    .field{margin:12px 0}
    .field>label{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
    .field textarea,.field input{width:100%;min-height:42px;border:1px solid #bbc3bb;border-radius:3px;padding:9px 10px;background:#fff;color:var(--ink)}
    .field textarea{min-height:84px;resize:vertical;line-height:1.5}
    .field textarea.tall{min-height:140px}
    .field:focus-within>label{color:#245335}
    .field-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
    .field-state{font-size:12px;color:var(--muted);flex:1 1 auto;min-width:0}
    .button{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;border:1px solid var(--ink);border-radius:3px;background:var(--ink);color:#fff;padding:7px 13px;font-size:13px;font-weight:700;text-decoration:none}
    .button.secondary{background:#fff;color:var(--ink)}
    .button.small{min-height:32px;padding:4px 9px;font-size:12px}
    .button.danger{background:#8c332e;border-color:#8c332e}
    .ai-box{margin-top:10px;border:1px solid #8ec6d2;background:#f1f9fa;border-radius:6px;padding:10px}
    .ai-box textarea{width:100%;min-height:64px;border:1px solid #9fb3bb;border-radius:4px;padding:7px 9px;font-size:13px;resize:vertical}
    .ai-box .ai-suggestion{background:#fff;border-color:#b7d7de}
    .ai-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
    .ai-checks{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:#24506b}
    .ai-checks label{display:inline-flex;align-items:center;gap:5px}
    .ai-reply{font-size:13px;color:#24506b;margin:8px 0 0;white-space:pre-wrap}
    .project-list{display:grid;gap:6px}
    .project-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;border:1px solid var(--line);background:#fafbf9;padding:8px 10px}
    .project-row strong{display:block;font-size:14px;overflow-wrap:anywhere}
    .project-row small{color:var(--muted);font-size:12px}
    .project-actions{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
    .project-actions .button{min-width:34px;padding:3px 7px;min-height:30px}
    .images{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:10px 0}
    .image-card{border:1px solid var(--line);background:#fafbf9;padding:6px;display:grid;gap:6px}
    .image-card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#e9ece7}
    .image-card .name{font-size:11px;color:var(--muted);overflow-wrap:anywhere;min-height:2.4em}
    .image-card .row{display:flex;gap:4px;flex-wrap:wrap}
    .image-card .button{min-width:30px;padding:2px 6px;min-height:28px;font-size:12px}
    .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0 4px}
    .muted{color:var(--muted);font-size:13px}
    .publish-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--line);padding:10px 12px;margin:0 0 16px}
    .publish-bar .muted{flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
    @media(max-width:820px){.layout{grid-template-columns:1fr}.nav{position:static;display:flex;flex-wrap:wrap;gap:4px}.nav button{width:auto;border-left:0;border-bottom:3px solid transparent;padding:8px 10px}.nav button.active{border-bottom-color:var(--gold)}.nav .nav-sep{display:none}}
  </style>
</head>
<body>
  <header class="top">
    <img src="/assets/brand/logo2.png" alt="Kocka Stúdió">
    <nav class="ks-app-menu" aria-label="Főmenü">
      <a href="/dashboard">Dashboard</a>
      <a href="/marketing">Marketing</a>
      <a href="/site" aria-current="page">Weboldal</a>
      <a href="/auth/logout">Kijelentkezés</a>
    </nav>
  </header>
  <main class="shell">
    <h1>Weboldal tartalma</h1>
    <p class="lead">A nyilvános honlap szövegei és projektfotói. A feltöltött képekhez automatikusan készül nagy változat és thumbnail. A szövegeknél az AI segít megfogalmazni; a javaslatot felülírhatod vagy a meglévő szöveghez fűzheted.</p>
    <div id="publishBar" class="publish-bar" hidden>
      <span id="publishInfo" class="muted"></span>
      <button id="publishButton" class="button small" type="button">Publikálás a weboldalba</button>
    </div>
    <div id="status" role="status" aria-live="polite"></div>
    <div id="app" hidden>
      <div class="layout">
        <nav class="nav" id="nav" aria-label="Oldalak"></nav>
        <section class="panel" id="panel"></section>
      </div>
    </div>
  </main>
  <script>
    'use strict';
    const statusNode=document.getElementById('status');
    const app=document.getElementById('app');
    const nav=document.getElementById('nav');
    const panel=document.getElementById('panel');
    let content=null,projectFields=[],view='pages',publish=null;

    function el(tag,cls,text){const node=document.createElement(tag);if(cls)node.className=cls;
      if(text!==undefined)node.textContent=text;return node}
    function status(text,kind){statusNode.replaceChildren();
      if(!text)return;const box=el('div','notice'+(kind?' '+kind:''),text);statusNode.append(box)}

    async function rpc(name,...args){
      const response=await fetch('/api/rpc',{method:'POST',credentials:'same-origin',
        headers:{'Content-Type':'application/json','X-Kocka-RPC':'1'},
        body:JSON.stringify({name,args})});
      const body=await response.json();
      if(response.status===401){location.replace('/auth/login?return='+encodeURIComponent(location.pathname+location.search)+'&reason=expired');
        throw new Error('A munkamenet lejárt.')}
      if(!response.ok)throw new Error(body.error||'A kérés nem sikerült.');
      return body.result;
    }

    function absolute(src){const value=String(src||'');
      return value.startsWith('/')?location.origin+value:value}

    function setContent(next){
      content=next.content||next;
      projectFields=next.projectFields||projectFields;
      publish=next.publish||publish;
      renderNav();
      renderView();
      renderPublish();
    }

    // A publikálás a weboldal projektjébe írja a TXT-ket, a projects.js-t és a
    // feltöltött képeket. A célmappa a szerveren beállított WEB_PROJECT_DIR.
    function renderPublish(){
      const bar=document.getElementById('publishBar');
      const info=document.getElementById('publishInfo');
      const button=document.getElementById('publishButton');
      if(!bar||!info||!button)return;
      if(!publish){bar.hidden=true;return}
      bar.hidden=false;
      if(publish.configured){
        info.textContent='Célmappa: '+publish.path;
        button.disabled=false;
      }else{
        info.textContent='A publikálás célmappája nem érhető el'+
          (publish.path?' ('+publish.path+')':'')+'. Állítsd be a WEB_PROJECT_DIR változót.';
        button.disabled=true;
      }
    }

    async function doPublish(){
      const button=document.getElementById('publishButton');
      if(!confirm('A szerkesztett tartalom bekerül a weboldal projektjébe (shared/data, shared/js, shared/img). Folytatod?'))return;
      button.disabled=true;status('Publikálás…');
      try{
        const result=await rpc('webPublish');
        status('Publikálva: '+result.files.length+' fájl, '+result.images+' feltöltött kép. '+
          'A weboldal deploy után jeleníti meg.','success');
      }catch(error){status(error.message||String(error),'error')}
      finally{button.disabled=false}
    }

    async function load(){
      try{
        const result=await rpc('webGetContent');
        app.hidden=false;
        setContent(result);
        status('');
      }catch(error){status(error.message||String(error),'error')}
    }

    function renderNav(){
      nav.replaceChildren();
      for(const page of content.pages){
        const button=el('button','',page.title);
        button.dataset.view='page:'+page.id;
        if(view==='page:'+page.id)button.classList.add('active');
        button.addEventListener('click',()=>{view='page:'+page.id;renderNav();renderView()});
        nav.append(button);
      }
      nav.append(el('div','nav-sep'));
      const projects=el('button','','Projektek ('+content.projects.length+')');
      projects.dataset.view='projects';
      if(view==='projects'||view.startsWith('project:'))projects.classList.add('active');
      projects.addEventListener('click',()=>{view='projects';renderNav();renderView()});
      nav.append(projects);
    }

    function renderView(){
      if(view==='projects')return renderProjects();
      if(view.startsWith('project:'))return renderProject(content.projects.find(item=>item.id===view.slice(8)));
      const page=content.pages.find(item=>item.id===view.slice(5))||content.pages[0];
      if(page)renderPage(page);
    }

    // Egy szövegmező: mentés elhagyáskor, valamint AI-segítség felülírással vagy
    // kiegészítéssel. A javaslat csak beillesztés után kerül a mezőbe.
    function fieldBlock(page,field){
      const wrap=el('div','field');
      const label=el('label','',field.label||field.key);
      label.htmlFor='field-'+page.id+'-'+field.key;
      const input=el('textarea',field.multiline?'tall':'');
      input.id=label.htmlFor;
      input.value=field.value||'';
      input.rows=field.multiline?4:2;
      const bar=el('div','field-bar');
      const state=el('span','field-state','');
      const aiButton=el('button','button secondary small','AI');
      aiButton.type='button';
      bar.append(state,aiButton);

      let timer=0,saving=false;
      async function save(){
        if(saving)return;
        const value=input.value;
        if(value===(field.value||''))return;
        saving=true;state.textContent='Mentés…';
        try{
          await rpc('webSaveField',page.id,field.key,value);
          field.value=value;
          state.textContent='Mentve';
          status('');
        }catch(error){state.textContent='';status(error.message||String(error),'error')}
        finally{saving=false}
      }
      input.addEventListener('input',()=>{state.textContent='Nem mentett módosítás';
        clearTimeout(timer);timer=setTimeout(save,900)});
      input.addEventListener('blur',()=>{clearTimeout(timer);save()});

      const ai=aiBox(page,field,()=>input.value,(value)=>{
        input.value=value;clearTimeout(timer);save();
      });
      ai.hidden=true;
      aiButton.addEventListener('click',()=>{ai.hidden=!ai.hidden;if(!ai.hidden)
        ai.querySelector('textarea').focus()});

      wrap.append(label,input,bar,ai);
      return wrap;
    }

    function aiBox(page,field,getCurrent,applyValue){
      const box=el('div','ai-box');
      const instruction=el('textarea','');
      instruction.placeholder='Mit fogalmazzon meg az AI? Például: „Legyen rövidebb és hivatalosabb.”';
      instruction.setAttribute('aria-label','AI utasítás');
      const actions=el('div','ai-actions');
      const send=el('button','button small','Küldés');send.type='button';
      const checks=el('div','ai-checks');
      const overwriteLabel=el('label','');
      const overwrite=el('input');overwrite.type='checkbox';overwrite.checked=true;
      overwriteLabel.append(overwrite,document.createTextNode(' Felülírás'));
      const appendLabel=el('label','');
      const append=el('input');append.type='checkbox';
      appendLabel.append(append,document.createTextNode(' Kiegészítés'));
      checks.append(overwriteLabel,appendLabel);
      actions.append(send);
      const reply=el('p','ai-reply','');
      const suggestion=el('textarea','ai-suggestion');
      suggestion.placeholder='Az AI javaslata itt jelenik meg.';
      suggestion.setAttribute('aria-label','AI javaslat');
      const applyRow=el('div','ai-actions');
      const apply=el('button','button small','Beillesztés');apply.type='button';
      const cancel=el('button','button secondary small','Mégse');cancel.type='button';
      applyRow.append(apply,cancel);
      suggestion.hidden=true;applyRow.hidden=true;
      box.append(instruction,actions,checks,reply,suggestion,applyRow);

      const history=[];
      overwrite.addEventListener('change',()=>{if(overwrite.checked)append.checked=false});
      append.addEventListener('change',()=>{if(append.checked)overwrite.checked=false});
      cancel.addEventListener('click',()=>{box.hidden=true;suggestion.hidden=true;
        applyRow.hidden=true;reply.textContent=''});

      send.addEventListener('click',async()=>{
        const text=instruction.value.trim();
        if(!text){reply.textContent='Írd le, mit fogalmazzon meg az AI.';return}
        send.disabled=true;reply.textContent='Az AI fogalmaz…';
        try{
          const result=await rpc('webAiText',{instruction:text,current:getCurrent(),
            label:field.label||field.key,page:page.title,history});
          history.push({role:'user',text});
          history.push({role:'assistant',text:result.reply||'Javaslat készült.'});
          reply.textContent=result.reply||'Az AI elkészítette a javaslatot.';
          suggestion.value=result.text;
          suggestion.hidden=false;applyRow.hidden=false;
          if(!append.checked&&!overwrite.checked)overwrite.checked=true;
        }catch(error){reply.textContent=error.message||String(error)}
        finally{send.disabled=false}
      });

      apply.addEventListener('click',()=>{
        const value=suggestion.value.trim();
        if(!value){reply.textContent='A javaslat üres.';return}
        const current=String(getCurrent()||'').trim();
        const next=append.checked&&current?current+'\n\n'+value:value;
        applyValue(next);
        suggestion.hidden=true;applyRow.hidden=true;
        reply.textContent='Beillesztve. Ellenőrizd, majd kattints a mezőn kívülre a mentéshez.';
      });
      return box;
    }

    function renderPage(page){
      panel.replaceChildren();
      const head=el('h2','',page.title);
      panel.append(head);
      panel.append(el('p','muted','A módosítás elhagyáskor automatikusan mentődik. Az AI javaslatát a „Beillesztés” viszi a mezőbe.'));
      for(const group of page.groups){
        if(group.title)panel.append(el('h2','',group.title));
        for(const field of group.fields)panel.append(fieldBlock(page,field));
      }
    }

    function renderProjects(){
      panel.replaceChildren();
      const head=el('h2','','Projektek');
      panel.append(head);
      const toolbar=el('div','toolbar');
      const add=el('button','button small','Új projekt');add.type='button';
      add.addEventListener('click',async()=>{
        add.disabled=true;
        try{const result=await rpc('webAddProject',{title:'Új projekt'});
          content=result;const created=content.projects[content.projects.length-1];
          view='project:'+created.id;renderNav();renderView();status('Az új projekt létrejött.','success');
        }catch(error){status(error.message||String(error),'error')}
        finally{add.disabled=false}
      });
      toolbar.append(add);
      panel.append(toolbar);
      panel.append(el('p','muted','A nyilakkal sorrendezhető a nyilvános oldal sorrendje.'));
      const list=el('div','project-list');
      content.projects.forEach((project,index)=>{
        const row=el('div','project-row');
        const info=el('div','');
        info.append(el('strong','',project.title||project.id));
        info.append(el('small','',[project.year,project.location,project.type,
          project.images.length+' kép'].filter(Boolean).join(' · ')));
        const actions=el('div','project-actions');
        const up=el('button','button secondary small','↑');up.type='button';up.title='Előre';
        up.disabled=index===0;
        up.addEventListener('click',()=>reorderProjects(index,index-1));
        const down=el('button','button secondary small','↓');down.type='button';down.title='Hátra';
        down.disabled=index===content.projects.length-1;
        down.addEventListener('click',()=>reorderProjects(index,index+1));
        const edit=el('button','button small','Szerkesztés');edit.type='button';
        edit.addEventListener('click',()=>{view='project:'+project.id;renderNav();renderView()});
        const remove=el('button','button danger small','Törlés');remove.type='button';
        remove.addEventListener('click',()=>deleteProject(project));
        actions.append(up,down,edit,remove);
        row.append(info,actions);
        list.append(row);
      });
      panel.append(list);
    }

    async function reorderProjects(from,to){
      const list=content.projects.slice();
      const [item]=list.splice(from,1);
      list.splice(to,0,item);
      try{content=await rpc('webReorderProjects',list.map(project=>project.id));
        renderNav();renderView();status('A sorrend mentve.','success');
      }catch(error){status(error.message||String(error),'error')}
    }

    async function deleteProject(project){
      if(!confirm('Törlöd a(z) „'+project.title+'” projektet a weboldalról? A feltöltött képei is törlődnek.'))return;
      try{content=await rpc('webDeleteProject',project.id);
        view='projects';renderNav();renderView();status('A projekt törölve.','success');
      }catch(error){status(error.message||String(error),'error')}
    }

    function renderProject(project){
      if(!project){view='projects';return renderProjects()}
      panel.replaceChildren();
      const head=el('h2','',project.title||project.id);
      panel.append(head);
      const back=el('button','button secondary small','← Vissza a listához');back.type='button';
      back.addEventListener('click',()=>{view='projects';renderNav();renderView()});
      panel.append(back);

      const inputs={};
      for(const [key,label,multiline] of projectFields){
        const wrap=el('div','field');
        const lab=el('label','',label);lab.htmlFor='project-'+key;
        const input=el('textarea',multiline?'tall':'');input.id=lab.htmlFor;
        input.value=project[key]??'';
        if(!multiline){input.rows=1}
        inputs[key]=input;
        wrap.append(lab,input);
        panel.append(wrap);
      }
      const saveBar=el('div','toolbar');
      const save=el('button','button small','Projekt adatainak mentése');save.type='button';
      save.addEventListener('click',async()=>{
        const patch={};for(const [key] of projectFields)patch[key]=inputs[key].value;
        save.disabled=true;
        try{content=await rpc('webSaveProject',project.id,patch);
          const updated=content.projects.find(item=>item.id===project.id);
          Object.assign(project,updated);
          renderNav();status('A projekt adatai mentve.','success');
        }catch(error){status(error.message||String(error),'error')}
        finally{save.disabled=false}
      });
      saveBar.append(save);
      panel.append(saveBar);

      panel.append(el('h2','','Fotók'));
      panel.append(el('p','muted','Feltöltéskor a rendszer nagy (1800 px) és thumbnail (520 px) változatot készít. A nyilakkal a galéria sorrendje állítható.'));
      const upload=el('input');upload.type='file';upload.accept='image/jpeg,image/png,image/webp';
      upload.multiple=true;
      upload.setAttribute('aria-label','Fotók feltöltése');
      const uploadBar=el('div','toolbar');uploadBar.append(upload);
      panel.append(uploadBar);
      upload.addEventListener('change',()=>uploadFiles(project,upload));

      const images=el('div','images');
      project.images.forEach((image,index)=>{
        const card=el('div','image-card');
        const img=el('img');img.src=absolute(image.thumb||image.src);img.alt=image.name||'';
        img.loading='lazy';
        const name=el('div','name',image.name||'');
        const row=el('div','row');
        const up=el('button','button secondary small','↑');up.type='button';up.title='Előre';
        up.disabled=index===0;
        up.addEventListener('click',()=>reorderImages(project,index,index-1));
        const down=el('button','button secondary small','↓');down.type='button';down.title='Hátra';
        down.disabled=index===project.images.length-1;
        down.addEventListener('click',()=>reorderImages(project,index,index+1));
        const remove=el('button','button danger small','Törlés');remove.type='button';
        remove.addEventListener('click',()=>deleteImage(project,image));
        row.append(up,down,remove);
        card.append(img,name,row);
        images.append(card);
      });
      if(!project.images.length)images.append(el('p','muted','Még nincs fotó ehhez a projekthez.'));
      panel.append(images);
    }

    async function uploadFiles(project,input){
      const files=[...input.files||[]];
      if(!files.length)return;
      input.disabled=true;
      let done=0;
      try{
        for(const file of files){
          if(!/^image\/(jpeg|png|webp)$/.test(file.type)){
            status('Csak JPG, PNG vagy WebP tölthető fel: '+file.name,'error');continue;
          }
          if(file.size>8*1024*1024){status('A kép legfeljebb 8 MB lehet: '+file.name,'error');continue}
          const base64=await new Promise((resolve,reject)=>{
            const reader=new FileReader();
            reader.onload=()=>resolve(String(reader.result).split(',')[1]||'');
            reader.onerror=()=>reject(new Error('A fájl nem olvasható.'));
            reader.readAsDataURL(file);
          });
          const result=await rpc('webUploadImage',project.id,file.name,file.type,base64);
          content=result.content;
          done+=1;
        }
        const updated=content.projects.find(item=>item.id===project.id);
        if(updated)Object.assign(project,updated);
        renderView();
        if(done)status(done+' kép feltöltve, a thumbnailek elkészültek.','success');
      }catch(error){status(error.message||String(error),'error')}
      finally{input.disabled=false;input.value=''}
    }

    async function deleteImage(project,image){
      if(!confirm('Törlöd ezt a képet: '+(image.name||'')+'?'))return;
      try{content=await rpc('webDeleteImage',project.id,image.src);
        const updated=content.projects.find(item=>item.id===project.id);
        if(updated)Object.assign(project,updated);
        renderView();status('A kép törölve.','success');
      }catch(error){status(error.message||String(error),'error')}
    }

    async function reorderImages(project,from,to){
      const list=project.images.slice();
      const [item]=list.splice(from,1);
      list.splice(to,0,item);
      try{content=await rpc('webReorderImages',project.id,list.map(image=>image.src));
        const updated=content.projects.find(entry=>entry.id===project.id);
        if(updated)Object.assign(project,updated);
        renderView();status('A képsorrend mentve.','success');
      }catch(error){status(error.message||String(error),'error')}
    }

    document.getElementById('publishButton').addEventListener('click',doPublish);
    load();
  </script>
</body>
</html>
